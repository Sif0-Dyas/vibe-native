name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (from uv.lock)
        # --locked: install exactly what uv.lock says, and FAIL if pyproject.toml was
        # edited without re-running `uv lock` -- drift breaks the build instead of
        # being quietly re-resolved. Once this passes the lock is known-current, so
        # the `uv run` steps below need no flag of their own. Python comes from
        # .python-version. On Linux the lock's platform marker selects the plain
        # onnxruntime wheel instead of onnxruntime-directml; the suite still runs in
        # FAKE_ANALYZER mode and the real-model tests skip (no models here).
        run: uv sync --locked --group dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Security scan (bandit)
        # SAST for the Python source. Known false-positives (fake-mode RNG seeds,
        # best-effort try/except around BPM/key, the ffmpeg/ffprobe subprocess
        # calls) carry inline `# nosec <id>` justifications, so a clean run is zero
        # findings and any NEW finding fails the build.
        run: uv run bandit -r src/vibenative/ -q

      - name: Dependency audit (pip-audit)
        # Audit the locked RUNTIME set (no dev/desktop groups) for known CVEs: every
        # exact version the app ships with, transitive deps included. --no-deps +
        # --disable-pip audits the pinned list as-is instead of re-resolving it.
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt -o /tmp/req-audit.txt
          uv run pip-audit -r /tmp/req-audit.txt --no-deps --disable-pip

      - name: Lint JS (eslint)
        # Static check for the split frontend (app.js / player.js / map.js share one
        # global scope). no-undef catches the split's failure mode: a function moved
        # to one file but still called from another (a cross-file ReferenceError no
        # Python check would see).
        run: |
          npm ci
          npx eslint src/vibenative/static/

      - name: Test (pytest + coverage floor)
        # FAKE_ANALYZER keeps the model/inference path out of CI. The engine modules
        # (decode/frontend_mel/onnx_engine/tempo/key) can't run without models, so
        # --cov-config=.coveragerc.ci OMITS them from CI's measurement — otherwise
        # they'd sit at ~0% and the total would say nothing about the code CI runs.
        # With them omitted CI's actual is 75.5%; the floor is 74 (2 under actual).
        # This floor is DIFFERENT from the local one (75, in pyproject.toml) on
        # purpose: CI measures a smaller module set than a full local run (~80%),
        # because a full run has the models and exercises the engine modules too.
        env:
          FAKE_ANALYZER: "1"
        run: uv run pytest -q --cov=vibenative --cov-config=.coveragerc.ci --cov-fail-under=74

      - name: Desktop shell selftest
        # Exercises the native launch-command + venv-resolution logic in
        # desktop/genre_app.pyw. Its --selftest path is pure stdlib (pywebview is
        # imported lazily only inside main()), so it needs no desktop group. uv sync
        # created the project .venv, so it resolves into .venv/bin/python.
        run: uv run python desktop/genre_app.pyw --selftest
