name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # onnxruntime-directml is intentionally omitted: it is a Windows-only wheel
        # (no Linux runner install), the ONNX engine modules import it lazily, and
        # the suite runs in FAKE_ANALYZER mode, so the models are never loaded. The
        # real-mode engine + integration tests skip when the models/onnxruntime are
        # absent, exactly as they do here.
        run: pip install flask mutagen numpy pytest pytest-cov ruff bandit pip-audit

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Security scan (bandit)
        # SAST for the Python source. Known false-positives (fake-mode RNG seeds,
        # best-effort try/except around BPM/key, the ffmpeg/ffprobe subprocess
        # calls) carry inline `# nosec <id>` justifications, so a clean run is zero
        # findings and any NEW finding fails the build.
        run: bandit -r native/vibenative/ -q

      - name: Dependency audit (pip-audit)
        # Audit the pinned runtime deps for known CVEs. onnxruntime-directml is
        # filtered out (its Windows-only wheel can't be resolved by pip-audit's
        # Linux sandbox); everything else (flask/mutagen/numpy) is audited, so a
        # future advisory on those fails the build.
        run: |
          grep -viE "onnxruntime" requirements.txt > /tmp/req-audit.txt
          pip-audit -r /tmp/req-audit.txt --no-deps

      - name: Lint JS (eslint)
        # Static check for the split frontend (app.js / player.js / map.js share one
        # global scope). no-undef catches the split's failure mode: a function moved
        # to one file but still called from another (a cross-file ReferenceError no
        # Python check would see).
        run: |
          npm ci
          npx eslint native/vibenative/static/

      - name: Test (pytest + coverage floor)
        # FAKE_ANALYZER keeps the model/inference path out of CI; the 50% floor is
        # set below full coverage on purpose, since analysis.py's real path and the
        # ONNX engine modules (decode/frontend_mel/onnx_engine/tempo/key) legitimately
        # can't run here — they have their own real-mode acceptance tests that skip
        # when the models are absent.
        env:
          FAKE_ANALYZER: "1"
        run: pytest -q --cov=vibenative --cov-fail-under=50

      - name: Desktop shell selftest
        # Exercises the native launch-command + venv-resolution logic in
        # desktop/genre_app.pyw. Its --selftest path is pure stdlib (pywebview is
        # imported lazily only inside main()), so it needs no extra CI deps; with no
        # project .venv on the runner it takes the documented sys.executable fallback.
        run: python desktop/genre_app.pyw --selftest
