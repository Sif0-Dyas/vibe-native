[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibenative"
version = "2.0.0"
description = "Native-Windows rebuild of Vibe_Identify — Flask + ONNX Runtime music genre / BPM / key analyzer with an interactive genre map."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Andres Avalos" }]
keywords = ["music", "genre", "onnx", "audio-analysis", "flask", "directml"]
dependencies = [
    "flask>=3.1",
    "mutagen>=1.47",
    "numpy>=2",
    "onnxruntime-directml",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7"]

[project.urls]
Repository = "https://github.com/Sif0-Dyas/vibe-native"

# The package lives under native/ (the engine's source root), so both the engine
# modules and the ported app share one importable `vibenative` package.
[tool.setuptools]
package-dir = { "" = "native" }
packages = ["vibenative", "vibenative.routes"]

[tool.setuptools.package-data]
vibenative = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["native"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["*.py"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sorting. E501 is left to the formatter
# (long model URLs are unsplittable and would false-positive otherwise).
select = ["E", "W", "F", "I"]
ignore = ["E501"]
