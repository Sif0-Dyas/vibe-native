[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibenative"
version = "2.1.0"  # keep in sync with vibenative.__version__
description = "Native-Windows rebuild of Vibe_Identify — Flask + ONNX Runtime music genre / BPM / key analyzer with an interactive genre map."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Andres Avalos" }]
keywords = ["music", "genre", "onnx", "audio-analysis", "flask", "directml"]
dependencies = [
    "flask>=3.1",
    "numpy>=2",
    "onnxruntime-directml",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7"]

[project.urls]
Repository = "https://github.com/Sif0-Dyas/vibe-native"

# The package lives under src/ (standard src-layout). Both the engine modules and
# the ported app share one importable `vibenative` package.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["vibenative", "vibenative.routes"]

[tool.setuptools.package-data]
vibenative = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Coverage floor for LOCAL / full-suite runs (models + onnxruntime present, so the
# engine modules key/tempo/decode/frontend_mel/onnx_engine are actually exercised).
# Actual is ~79%; 75 sits just under it so the next regression trips it. CI cannot
# load models, so it measures a DIFFERENT (smaller) module set with its own, lower
# floor — see .coveragerc.ci and the Test step in .github/workflows/ci.yml.
[tool.coverage.report]
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py311"
# .pyw isn't in ruff's default discovery, so the desktop shell (a .pyw) would be
# silently skipped by `ruff check .`. Include it so lint + format cover it.
include = ["*.py", "*.pyw"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sorting. E501 is left to the formatter
# (long model URLs are unsplittable and would false-positive otherwise).
select = ["E", "W", "F", "I"]
ignore = ["E501"]
